<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问问调解平台 - 登录（DEMO）</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>⚖ 问问调解平台</h1>
    <div class="sub">法院调解业务管理系统 2.0 · 可演示原型（DEMO，数据均为虚构）</div>
    <label>手机号</label>
    <input type="text" placeholder="请输入手机号" value="138****6688">
    <label>验证码</label>
    <div class="code-row">
      <input type="text" placeholder="请输入验证码" value="888888">
      <button class="btn demo-btn" data-msg="验证码已发送（演示）">获取验证码</button>
    </div>
    <button class="login-btn" onclick="alert('演示：登录成功，请选择下方角色进入对应端')">登 录</button>
    <div class="role-pick">
      <div class="hint">DEMO 快捷入口 —— 选择角色直接进入（登录身份仅两种，主管为调解员的管理属性）：</div>
      <div class="role-btns">
        <a class="role-btn" href="admin.html"><b>系统管理员</b><span>设置层 · 全平台管理</span></a>
        <a class="role-btn" href="ops.html"><b>调解员</b><span>操作端 · 普通调解员</span></a>
        <a class="role-btn" href="ops.html" onclick="sessionStorage.setItem('sup','1')"><b>调解员（主管标识）</b><span>操作端 · 含主管专属功能</span></a>
      </div>
    </div>
    <div style="margin-top:14px;font-size:11px;color:#8f959e">注册需管理员审核；注册时选择的法院+调解组织自动生成待审核绑定申请</div>
  </div>
</div>
</body>
</html>
